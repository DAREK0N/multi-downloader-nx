[package]
name = "multi-downloader-nx"
version = "0.1.0"
authors = ["DAREKON <63023042+DAREK0N@users.noreply.github.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Dioxus Framework
dioxus = { version = "0.7.3", features = ["router", "fullstack"] }
dioxus-ssr = "0.7.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Templating (for Discord webhooks)
handlebars = "6"

# Internationalization
rust-i18n = "3"

# Platform-specific dependencies for server/desktop
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }
sled = { version = "0.34", optional = true }
tokio-cron-scheduler = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }

# Web APIs (for browser features)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "DomTokenList", "Storage", "Location", "MediaQueryList"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }

[features]
default = ["web", "server", "db-sqlite"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
db-sqlite = ["sqlx"]
db-sled = ["sled"]
