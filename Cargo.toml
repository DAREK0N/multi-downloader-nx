[package]
name = "multi-downloader-nx"
version = "5.6.9"
edition = "2021"
authors = ["AnimeDL <AnimeDL@users.noreply.github.com>"]
description = "Downloader for Crunchyroll, Hidive, and AnimationDigitalNetwork with Dioxus fullstack GUI"
license = "MIT"
repository = "https://github.com/anidl/multi-downloader-nx"

[dependencies]
# Dioxus Core - using 0.7.3 (latest stable)
dioxus = { version = "0.7", features = ["fullstack", "router"] }
dioxus-ssr = "0.7"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Scheduling
tokio-cron-scheduler = "0.13"
chrono = { version = "0.4", features = ["serde"] }

# Internationalization
rust-i18n = "3"

# Templating for Discord webhooks
handlebars = "6"

# Error Handling & Logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# Testing dependencies will be added as needed

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# rust-i18n configuration
[package.metadata.i18n]
available-locales = ["en", "de", "es", "fr", "it", "pt", "pt-BR", "ru", "zh-CN", "zh-TW", "ja", "ko", "pl", "nl", "tr", "ar"]
default-locale = "en"
